<script>
/* ==================================================================
   Royal Metal Allocation System — Scripts.html
   Client logic only. Every rule here is re-validated on the server.
   ================================================================== */
(function () {
  'use strict';

  /* Build stamp. Check this in the browser console to confirm which version of
     Scripts.html the deployment is actually serving. */
  var BUILD = 'RMAS-Scripts-5C.2';
  try { console.log('[RMAS] client build: ' + BUILD); } catch (e) { /* ignore */ }

  var DECIMALS = 3;
  var EPS = 0.0005;

  var STATE = {
    booted: false,
    busy: false,
    readOnly: true,
    canRevise: false,
    isAdmin: false,
    email: '',
    displayName: '',
    role: 'ADMIN',
    isOperator: false,
    canEditRequired: true,
    canEditAcquired: true,
    canEditAlloted: true,
    showGlobalTotals: true,
    dateKey: '',
    model: null,        // server model currently on screen
    baseline: null,     // snapshot used by Reset Unsaved Changes
    allocSectors: [],
    flowSectors: [],
    modalHandler: null
  };

  /* ------------------------- small helpers ------------------------ */

  function $(id) { return document.getElementById(id); }

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function round3(n) {
    var v = Number(n);
    if (!isFinite(v)) return 0;
    return Math.round((v + Number.EPSILON) * 1000) / 1000;
  }

  function fmt3(n) { return round3(n).toFixed(DECIMALS); }
  function fmt1(n) { var v = Number(n); return (isFinite(v) ? v : 0).toFixed(1); }

  function num(value) {
    if (value === null || value === undefined || value === '') return 0;
    var n = Number(String(value).replace(/,/g, '').trim());
    return isFinite(n) && n > 0 ? round3(n) : (isFinite(n) ? round3(n) : 0);
  }

  function todayIso() {
    var d = new Date();
    var m = String(d.getMonth() + 1); if (m.length < 2) m = '0' + m;
    var day = String(d.getDate()); if (day.length < 2) day = '0' + day;
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function priorityClass(priority) {
    var m = String(priority || '').match(/(\d)/);
    var n = m ? Number(m[1]) : 6;
    if (n < 1 || n > 6) n = 6;
    return 'badge badge--p' + n;
  }

  function uuid() {
    return 'REQ-' + Date.now().toString(36) + '-' +
      Math.random().toString(36).substring(2, 10) + '-' +
      Math.random().toString(36).substring(2, 6);
  }

  /* --------------------------- chrome UI -------------------------- */

  function showOverlay(text) {
    $('overlayText').textContent = text || 'Working\u2026';
    $('overlay').classList.remove('hidden');
  }
  function hideOverlay() { $('overlay').classList.add('hidden'); }

  function toast(type, message) {
    var stack = $('toastStack');
    var el = document.createElement('div');
    el.className = 'toast toast--' + (type || 'info');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, type === 'error' ? 9000 : 5000);
  }

  function setBanner(kind, message) {
    var banner = $('banner');
    if (!message) { banner.classList.add('hidden'); return; }
    banner.className = 'banner banner--' + kind;
    var icons = { error: '!', warn: '!', success: '\u2713', locked: '\u25A0', info: 'i' };
    $('bannerIcon').textContent = icons[kind] || 'i';
    $('bannerText').textContent = message;
    banner.classList.remove('hidden');
  }

  function setHeaderStatus(kind, text) {
    var pill = $('hdrStatus');
    pill.className = 'status-pill status-pill--' + kind;
    pill.textContent = text;
  }

  function setBarStatus(text) { $('barStatus').textContent = text; }

  function openModal(opts) {
    $('modalTitle').textContent = opts.title || 'Confirm';
    $('modalBody').innerHTML = opts.bodyHtml || '';
    $('modalConfirm').textContent = opts.confirmLabel || 'Confirm';
    $('modalReasonError').classList.add('hidden');
    $('modalReason').value = '';
    if (opts.requireReason) $('modalReasonWrap').classList.remove('hidden');
    else $('modalReasonWrap').classList.add('hidden');
    STATE.modalHandler = opts.onConfirm || null;
    $('modal').classList.remove('hidden');
  }
  function closeModal() {
    $('modal').classList.add('hidden');
    STATE.modalHandler = null;
  }

  /* --------------------------- rendering -------------------------- */

  function renderAllocationRows(rows) {
    var lockRequired = !STATE.canEditRequired;
    var lockAlloted = !STATE.canEditAlloted;

    // An empty list means no sector is mapped to this user's party. Say so,
    // rather than leaving a table that shows nothing but a zero totals row.
    if (!rows.length) {
      $('allocBody').innerHTML =
        '<tr><td colspan="6" class="empty-cell">' +
          'No allocation sectors are mapped to your party. ' +
          'Ask the administrator to check the Party column in Metal Generator.' +
        '</td></tr>';
      $('allocRowCount').textContent = '0 sectors';
      return;
    }
    var html = rows.map(function (r, i) {
      return '' +
        '<tr class="alloc-row" data-index="' + i + '" data-sector="' + esc(r.sector) + '">' +
          '<td class="cell-sector" data-label="Sector">' +
            '<span class="sector-name">' + esc(r.sector) + '</span>' +
            '<button type="button" class="row-toggle" data-toggle="' + i + '" aria-label="Toggle details">&minus;</button>' +
          '</td>' +
          '<td class="cell-purity m-detail" data-label="Purity">' + esc(r.purity || 'Any') + '</td>' +
          '<td class="num m-detail" data-label="Previous Requirement">' +
            '<span class="readonly-value" id="prevReq-' + i + '">' + fmt3(r.previousRequirement) + '</span>' +
          '</td>' +
          '<td class="num m-detail" data-label="Today\u2019s Required">' +
            '<input type="number" inputmode="decimal" step="0.001" min="0" ' +
              'class="cell-input js-required" id="req-' + i + '" data-index="' + i + '" ' +
              'value="' + (r.todayRequired ? fmt3(r.todayRequired) : '') + '" ' +
              'placeholder="0.000" aria-label="Today\u2019s Required Weight for ' + esc(r.sector) + '"' +
              (lockRequired ? ' disabled' : '') + '>' +
            '<div class="inline-error hidden" id="reqErr-' + i + '"></div>' +
          '</td>' +
          '<td class="num" data-label="Alloted">' +
            '<input type="number" inputmode="decimal" step="0.001" min="0" ' +
              'class="cell-input js-alloted" id="alt-' + i + '" data-index="' + i + '" ' +
              'value="' + (r.alloted ? fmt3(r.alloted) : '') + '" ' +
              'placeholder="0.000" aria-label="Alloted for ' + esc(r.sector) + '"' +
              (lockAlloted ? ' disabled' : '') + '>' +
            '<div class="inline-error hidden" id="altErr-' + i + '"></div>' +
          '</td>' +
          '<td class="num" data-label="Balance">' +
            '<span class="balance-value" id="bal-' + i + '">' + fmt3(r.balance) + '</span>' +
          '</td>' +
        '</tr>';
    }).join('');
    $('allocBody').innerHTML = html;
    $('allocRowCount').textContent = rows.length + ' sectors';
  }

  function renderFlowRows(rows) {
    var lockAcquired = !STATE.canEditAcquired;

    if (!rows.length) {
      $('flowBody').innerHTML =
        '<tr><td colspan="3" class="empty-cell">' +
          'No Metal Flow sectors are mapped to your party, so there is nothing to enter here. ' +
          'Ask the administrator to set the Party for the Metal Flow sectors.' +
        '</td></tr>';
      $('flowRowCount').textContent = '0 sectors';
      return;
    }
    var html = rows.map(function (r, i) {
      return '' +
        '<tr class="flow-row" data-index="' + i + '" data-sector="' + esc(r.sector) + '">' +
          '<td class="cell-sector" data-label="Sector">' +
            '<span class="sector-name">' + esc(r.sector) + '</span>' +
          '</td>' +
          '<td class="num" data-label="Previous Acquired">' +
            '<span class="readonly-value readonly-value--blue">' + fmt3(r.previousAcquired) + '</span>' +
          '</td>' +
          '<td class="num" data-label="Today\u2019s Acquired">' +
            '<input type="number" inputmode="decimal" step="0.001" min="0" ' +
              'class="cell-input cell-input--acquired js-acquired" id="acq-' + i + '" data-index="' + i + '" ' +
              'value="' + (r.todayAcquired ? fmt3(r.todayAcquired) : '') + '" ' +
              'placeholder="0.000" aria-label="Today\u2019s Acquired for ' + esc(r.sector) + '"' +
              (lockAcquired ? ' disabled' : '') + '>' +
            '<div class="inline-error hidden" id="acqErr-' + i + '"></div>' +
          '</td>' +
        '</tr>';
    }).join('');
    $('flowBody').innerHTML = html;
    $('flowRowCount').textContent = rows.length + ' sectors';
  }

  /* -------------------------- calculation ------------------------- */

  function readScreen() {
    var allocations = STATE.model.allocations.map(function (r, i) {
      var reqEl = $('req-' + i);
      var altEl = $('alt-' + i);
      var todayRequired = num(reqEl ? reqEl.value : r.todayRequired);
      var alloted = num(altEl ? altEl.value : r.alloted);
      return {
        priority: r.priority,
        sector: r.sector,
        purity: r.purity,
        previousRequirement: round3(r.previousRequirement),
        todayRequired: todayRequired,
        alloted: alloted,
        balance: round3(r.previousRequirement + todayRequired - alloted)
      };
    });

    var metalFlow = STATE.model.metalFlow.map(function (r, i) {
      var el = $('acq-' + i);
      return {
        sector: r.sector,
        previousAcquired: round3(r.previousAcquired),
        todayAcquired: num(el ? el.value : r.todayAcquired)
      };
    });

    return { allocations: allocations, metalFlow: metalFlow };
  }

  function computeTotals(screen) {
    var t = {
      totalPreviousRequirement: 0, totalTodayRequired: 0, totalAlloted: 0,
      totalBalance: 0, totalAcquired: 0, totalPreviousAcquired: 0
    };
    screen.allocations.forEach(function (r) {
      t.totalPreviousRequirement += r.previousRequirement;
      t.totalTodayRequired += r.todayRequired;
      t.totalAlloted += r.alloted;
      t.totalBalance += r.balance;
    });
    screen.metalFlow.forEach(function (r) {
      t.totalAcquired += r.todayAcquired;
      t.totalPreviousAcquired += r.previousAcquired;
    });
    Object.keys(t).forEach(function (k) { t[k] = round3(t[k]); });
    t.remainingToAllocate = round3(Math.max(0, t.totalAcquired - t.totalAlloted));
    t.overAllocatedBy = round3(Math.max(0, t.totalAlloted - t.totalAcquired));
    return t;
  }

  function recalc() {
    if (!STATE.model) return;

    var screen = readScreen();
    var t = computeTotals(screen);

    // Per-row balance + negative guards
    screen.allocations.forEach(function (r, i) {
      var balEl = $('bal-' + i);
      if (balEl) {
        balEl.textContent = fmt3(r.balance);
        balEl.className = 'balance-value ' + (round3(r.balance) === 0 ? 'balance-value--zero' : 'balance-value--positive');
      }
      flagInput($('req-' + i), $('reqErr-' + i), r.todayRequired < 0 ? 'Negative values are not allowed.' : '');
      flagInput($('alt-' + i), $('altErr-' + i), r.alloted < 0 ? 'Negative values are not allowed.' : '');
    });
    screen.metalFlow.forEach(function (r, i) {
      flagInput($('acq-' + i), $('acqErr-' + i), r.todayAcquired < 0 ? 'Negative values are not allowed.' : '');
    });

    // KPI cards
    $('kpiPrevRequirement').textContent = fmt3(t.totalPreviousRequirement);
    $('kpiTodayRequired').textContent = fmt3(t.totalTodayRequired);
    $('kpiAcquired').textContent = fmt3(t.totalAcquired);
    $('kpiAlloted').textContent = fmt3(t.totalAlloted);
    $('kpiClosingBalance').textContent = fmt3(t.totalBalance);

    /*
     * Micro-statistics under the Acquired, Alloted and Closing Balance
     * cards. Demand for the day is the requirement carried forward plus
     * the new indents raised today:
     *
     *     demand      = totalPreviousRequirement + totalTodayRequired
     *     fulfilment  = alloted / demand * 100
     *     outstanding = balance / demand * 100
     *
     * Demand can be zero or negative when sectors carry credit from an
     * earlier over-allocation, so each ratio falls back to a plain label
     * rather than dividing by zero.
     */
    var demand = t.totalPreviousRequirement + t.totalTodayRequired;
    $('kpiAcquiredSub').textContent = demand > 0
      ? (fmt1((t.totalAcquired / demand) * 100) + '% of today\u2019s demand')
      : 'kg received today';
    $('kpiAllotedFulfil').textContent = demand > 0
      ? fmt1((t.totalAlloted / demand) * 100) + '%'
      : '\u2014';
    $('kpiClosingSub').textContent = demand > 0
      ? (fmt1((t.totalBalance / demand) * 100) + '% of demand outstanding')
      : 'kg carried forward';

    // Table totals
    $('totPrevRequirement').textContent = fmt3(t.totalPreviousRequirement);
    $('totTodayRequired').textContent = fmt3(t.totalTodayRequired);
    $('totAlloted').textContent = fmt3(t.totalAlloted);
    $('totBalance').textContent = fmt3(t.totalBalance);
    $('totPrevAcquired').textContent = fmt3(t.totalPreviousAcquired);
    $('totAcquired').textContent = fmt3(t.totalAcquired);

    // Flow summary
    $('flowSummaryAcquired').textContent = fmt3(t.totalAcquired) + ' kg';
    $('flowSummaryAlloted').textContent = fmt3(t.totalAlloted) + ' kg';
    $('flowSummaryRemaining').textContent = fmt3(t.remainingToAllocate) + ' kg';

    updateRemainingState(t);
    updateSaveState(t);
    return t;
  }

  function flagInput(input, errorEl, message) {
    if (!input || !errorEl) return;
    if (message) {
      input.classList.add('is-invalid');
      errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    } else {
      input.classList.remove('is-invalid');
      errorEl.classList.add('hidden');
    }
  }

  function updateRemainingState(t) {
    var card = $('kpiRemainingCard');
    var note = $('kpiRemainingNote');
    var barWrap = $('barRemainingWrap');
    var summaryRow = $('flowSummaryRemainingRow');

    $('kpiRemaining').textContent = fmt3(t.remainingToAllocate);
    $('barRemaining').textContent = fmt3(t.remainingToAllocate) + ' kg';

    var kind = 'primary';
    if (t.overAllocatedBy > 0) kind = 'error';
    else if (t.totalAcquired > 0 && t.remainingToAllocate === 0) kind = 'done';
    else if (t.totalAcquired > 0 && t.remainingToAllocate <= round3(t.totalAcquired * 0.1)) kind = 'warn';

    card.className = 'kpi kpi--' + kind;
    barWrap.className = 'action-bar__remaining' +
      (kind === 'error' ? ' is-error' : (kind === 'done' ? ' is-done' : (kind === 'warn' ? ' is-warn' : '')));
    summaryRow.className = 'flow-summary__row flow-summary__row--strong' +
      (kind === 'error' ? ' flow-summary__row--error' : (kind === 'warn' ? ' flow-summary__row--warn' : ''));

    if (kind === 'error') note.textContent = 'kg over-allocated by ' + fmt3(t.overAllocatedBy);
    else if (kind === 'done') note.textContent = 'kg \u2014 fully allocated';
    else if (kind === 'warn') note.textContent = 'kg nearly exhausted';
    else note.textContent = 'kg available';
  }

  function updateSaveState(t) {
    var saveBtn = $('btnSave');
    var resetBtn = $('btnReset');

    if (STATE.isOperator) {
      var lockedForOperator = !!(STATE.model && STATE.model.isSaved);
      resetBtn.disabled = lockedForOperator;
      if (lockedForOperator) {
        saveBtn.disabled = true;
        setBarStatus('This date has been finalised by the administrator.');
        return;
      }
      // Requirement is demand and Acquired is supply, so requirement may
      // legitimately exceed the metal in hand. No cross-check here.
      var opReason = '';
      if (!(t.totalAcquired > 0)) opReason = 'Enter Today\u2019s Acquired metal before submitting.';
      else if (!(t.totalTodayRequired > 0)) opReason = 'Enter Today\u2019s Required weight before submitting.';

      saveBtn.disabled = STATE.busy || !!opReason;

      var opNote;
      if (opReason) {
        opNote = opReason;
      } else if ((t.totalTodayRequired - t.totalAcquired) > EPS) {
        opNote = 'Ready to submit. Requirement exceeds acquired metal by ' +
          fmt3(t.totalTodayRequired - t.totalAcquired) + ' kg, which carries forward as balance.';
      } else {
        opNote = 'Ready to submit ' + fmt3(t.totalTodayRequired) + ' kg of requirement.';
      }
      setBarStatus(opNote);
      return;
    }

    if (STATE.readOnly) {
      saveBtn.disabled = true;
      resetBtn.disabled = true;
      saveBtn.textContent = 'Save Current Data';
      setBarStatus('Data Already Saved. This date is locked and cannot be saved again.');
      return;
    }
    resetBtn.disabled = false;

    // The Alloted-vs-Acquired constraints are off: an administrator saves
    // whenever they choose. Only the presence of acquired metal is required.
    var reason = '';
    if (!(t.totalAcquired > 0)) {
      reason = 'Enter Today\u2019s Acquired metal in the Metal Flow panel before saving.';
    }

    saveBtn.disabled = STATE.busy || !!reason;

    var note;
    if (reason) note = reason;
    else if (t.overAllocatedBy > 0) {
      note = 'Ready to save. Alloted exceeds Acquired by ' + fmt3(t.overAllocatedBy) + ' kg.';
    } else if (t.remainingToAllocate > 0) {
      note = 'Ready to save. ' + fmt3(t.remainingToAllocate) + ' kg still unallocated.';
    } else {
      note = 'Ready to save. ' + fmt3(t.totalAlloted) + ' kg fully allocated.';
    }
    setBarStatus(note);
  }

  /**
   * Applies the role to the page chrome.
   * Operators do not allocate, so the workbook-wide KPIs are hidden and the
   * primary action becomes Submit Requirement.
   */
  function applyRoleChrome() {
    var operator = STATE.isOperator;

    ['kpiRemainingCard'].forEach(function (id) {
      var el = $(id);
      if (el) el.classList.toggle('hidden', operator && !STATE.showGlobalTotals);
    });
    var remainingRow = $('flowSummaryRemainingRow');
    if (remainingRow) remainingRow.classList.toggle('hidden', operator);
    var barWrap = $('barRemainingWrap');
    if (barWrap) barWrap.classList.toggle('hidden', operator);

    var saveBtn = $('btnSave');
    if (saveBtn && saveBtn.dataset.mode !== 'revise') {
      saveBtn.textContent = operator ? 'Submit Requirement' : 'Save Current Data';
    }
    var reviseBtn = $('btnAdminRevise');
    if (reviseBtn && operator) reviseBtn.classList.add('hidden');
  }

  /* --------------------------- data loading ----------------------- */

  function bootstrap() {
    showOverlay('Starting the application\u2026');
    google.script.run
      .withSuccessHandler(function (res) {
        hideOverlay();
        if (!res || !res.ok) {
          setBanner('error', (res && res.message) || 'The application could not start.');
          setHeaderStatus('error', 'Error');
          return;
        }
        STATE.booted = true;
        STATE.isAdmin = !!(res.data.access && res.data.access.isAdmin);
        STATE.role = (res.data.access && res.data.access.role) || (STATE.isAdmin ? 'ADMIN' : 'OPERATOR');
        STATE.isOperator = !STATE.isAdmin;
        applyRoleChrome();
        STATE.email = (res.data.access && res.data.access.email) || '';
        STATE.allocSectors = res.data.allocationSectors || [];
        STATE.flowSectors = res.data.flowSectors || [];
        STATE.displayName = (res.data.access && res.data.access.displayName) || STATE.email;
        $('hdrUser').textContent = STATE.displayName;
        $('hdrUser').title = STATE.email;
        var initial = res.data.today || todayIso();
        $('allocationDate').value = initial;
        loadDate(initial);
      })
      .withFailureHandler(function (err) {
        hideOverlay();
        setHeaderStatus('error', 'Error');
        setBanner('error', 'The application could not reach the server. Reload the page and try again.');
        console.error(err);
      })
      .getAppBootstrapData();
  }

  function loadDate(dateValue) {
    if (!dateValue) { setBanner('warn', 'Select an allocation date.'); return; }
    showOverlay('Loading previous day data\u2026');
    setHeaderStatus('neutral', 'Loading');
    $('btnSave').disabled = true;

    google.script.run
      .withSuccessHandler(function (res) {
        hideOverlay();
        if (!res || !res.ok) {
          setBanner('error', (res && res.message) || 'The date could not be loaded.');
          setHeaderStatus('error', 'Error');
          return;
        }
        applyModel(res.data, res.code, res.message);
      })
      .withFailureHandler(function (err) {
        hideOverlay();
        setHeaderStatus('error', 'Error');
        setBanner('error', 'The date could not be loaded. Check the connection and try again.');
        console.error(err);
      })
      .getAllocationForDate(dateValue);
  }

  function applyModel(model, code, message) {
    STATE.model = model;
    STATE.dateKey = model.selectedDate;
    STATE.readOnly = !!model.readOnly;
    STATE.canRevise = !!model.canRevise;
    STATE.isOperator = !!model.isOperator;
    // Each field's editability comes from the server. Nothing is inferred here.
    STATE.canEditRequired = (model.canEditRequired !== false) && !model.isSaved;
    STATE.canEditAcquired = (model.canEditAcquired !== false) && !model.isSaved;
    STATE.canEditAlloted = (model.canEditAlloted !== false) && !model.isSaved;
    STATE.showGlobalTotals = model.showGlobalTotals !== false;
    applyRoleChrome();
    STATE.baseline = JSON.parse(JSON.stringify({
      allocations: model.allocations, metalFlow: model.metalFlow
    }));

    $('hdrSelectedDate').textContent = model.selectedDateDisplay;
    $('hdrPrevDate').textContent = model.previousSourceDateDisplay;
    $('prevSourceDateBox').textContent = model.previousSourceDateDisplay;

    renderAllocationRows(model.allocations);
    renderFlowRows(model.metalFlow);

    if (model.isSaved) {
      setHeaderStatus('locked', 'Saved / Read-only');
      $('dateStatusBox').textContent = 'Data Already Saved (' + model.savedRecordCount + ' allocation records)';
      setBanner('locked', 'Data Already Saved. This date is locked and cannot be saved again. Select a new date.');
    } else {
      setHeaderStatus('editable', 'Editable');
      $('dateStatusBox').textContent = 'Not saved yet \u2014 open for entry';
      if (code === 'NO_PREVIOUS_DATA') {
        setBanner('info', message || 'No previous source date records were found. Previous values are shown as 0.000.');
      } else {
        setBanner('info', 'Previous values loaded from ' + model.previousSourceDateDisplay + '.');
      }
    }

    $('btnAdminRevise').classList.toggle('hidden', !STATE.canRevise);
    recalc();
    announceSubmissions(model);
  }

  /**
   * Tells an administrator which parties have submitted for the loaded date.
   * Shown once per date so refreshing does not nag, and never for an operator,
   * who is only ever looking at their own submission.
   */
  function announceSubmissions(model) {
    var list = model.stagingSubmissions || [];

    if (STATE.isOperator) {
      if (model.isSubmitted) {
        setBanner('locked', 'Requirement submitted' +
          (model.submittedAt ? ' on ' + model.submittedAt : '') +
          '. It is locked and awaiting the administrator.');
      }
      return;
    }

    // No once-per-session gate: every load shows the full current set, so a
    // second operator submitting is never missed on a reload.
    if (!list.length || model.isSaved) return;

    var partyRows = list.map(function (s) {
      return '<li style="margin-bottom:6px;"><strong>' + esc(s.party) + '</strong>' +
        (s.submittedAt ? ' <span style="color:#5b6577;font-size:12px;">submitted ' +
          esc(s.submittedAt) + '</span>' : '') + '</li>';
    }).join('');

    openModal({
      title: 'Requirements Received (' + list.length + ')',
      confirmLabel: 'Continue',
      bodyHtml:
        'The following part' + (list.length === 1 ? 'y has' : 'ies have') +
        ' submitted a requirement for <strong>' + esc(model.selectedDateDisplay) + '</strong>:' +
        '<ul style="margin:12px 0 0 18px;padding:0;">' + partyRows + '</ul>' +
        '<div style="margin-top:14px;">Their figures are already loaded into the ' +
        'Today\u2019s Required and Today\u2019s Acquired fields. Adjust them if needed, ' +
        'enter the allocation, then save.</div>',
      onConfirm: closeModal
    });
  }

  /* ------------------------------ saving -------------------------- */

  function buildPayload(extra) {
    var screen = readScreen();
    var payload = {
      requestId: uuid(),
      selectedDate: STATE.dateKey,
      allocations: screen.allocations.map(function (r) {
        return {
          sector: r.sector,
          priority: r.priority,
          purity: r.purity,
          previousRequirement: r.previousRequirement,
          todayRequired: r.todayRequired,
          alloted: r.alloted
        };
      }),
      metalFlow: screen.metalFlow.map(function (r) {
        return { sector: r.sector, todayAcquired: r.todayAcquired };
      })
    };
    if (extra) Object.keys(extra).forEach(function (k) { payload[k] = extra[k]; });
    return payload;
  }

  function requestSubmission() {
    if (STATE.busy) return;
    var t = recalc();
    if ($('btnSave').disabled) { toast('warn', $('barStatus').textContent); return; }

    openModal({
      title: 'Submit Requirement',
      confirmLabel: 'Submit Requirement',
      bodyHtml:
        'Submit your requirement for <strong>' + esc(STATE.model.selectedDateDisplay) + '</strong>?<br><br>' +
        'Total Today\u2019s Required: <strong>' + fmt3(t.totalTodayRequired) + ' kg</strong><br>' +
        'Total Today\u2019s Acquired: <strong>' + fmt3(t.totalAcquired) + ' kg</strong><br><br>' +
        '<strong>A submission cannot be changed once sent.</strong> It will be locked until the ' +
        'administrator finalises the date.',
      onConfirm: function () { closeModal(); doSubmit(); }
    });
  }

  function doSubmit() {
    STATE.busy = true;
    $('btnSave').disabled = true;
    showOverlay('Submitting your requirement\u2026');

    google.script.run
      .withSuccessHandler(function (res) {
        STATE.busy = false;
        hideOverlay();
        if (res && res.ok) {
          toast('success', res.message);
          setBanner('success', res.message);
          loadDate(STATE.dateKey);
        } else {
          var msg = (res && res.message) || 'The requirement could not be submitted.';
          toast('error', msg);
          setBanner('error', msg);
          recalc();
        }
      })
      .withFailureHandler(function (err) {
        STATE.busy = false;
        hideOverlay();
        toast('error', 'The submission could not be completed. Reload the date to check.');
        console.error(err);
        recalc();
      })
      .submitOperatorRequirements(buildPayload());
  }

  function requestSave() {
    if (STATE.busy || STATE.readOnly) return;
    var t = recalc();
    if ($('btnSave').disabled) {
      toast('warn', $('barStatus').textContent);
      return;
    }
    openModal({
      title: 'Confirm Save',
      confirmLabel: 'Save Current Data',
      bodyHtml:
        'Save the allocation for <strong>' + esc(STATE.model.selectedDateDisplay) + '</strong>?<br><br>' +
        'Total Today\u2019s Acquired: <strong>' + fmt3(t.totalAcquired) + ' kg</strong><br>' +
        'Actual Total Alloted: <strong>' + fmt3(t.totalAlloted) + ' kg</strong><br>' +
        'Unallocated: <strong>' + fmt3(t.remainingToAllocate) + ' kg</strong><br>' +
        'Closing Balance: <strong>' + fmt3(t.totalBalance) + ' kg</strong><br><br>' +
        'A saved date becomes permanently locked for regular users.',
      onConfirm: function () { closeModal(); doSave(); }
    });
  }

  function doSave() {
    STATE.busy = true;
    $('btnSave').disabled = true;
    showOverlay('Saving allocation and Metal Flow data\u2026');

    google.script.run
      .withSuccessHandler(function (res) {
        STATE.busy = false;
        hideOverlay();
        if (res && res.ok) {
          toast('success', res.message);
          setBanner('success', res.message);
          loadDate(STATE.dateKey);   // reload as locked read-only
        } else {
          var msg = (res && res.message) || 'The data could not be saved.';
          toast('error', msg);
          setBanner('error', msg);
          if (res && res.code === 'DATE_ALREADY_SAVED') loadDate(STATE.dateKey);
          else recalc();
        }
      })
      .withFailureHandler(function (err) {
        STATE.busy = false;
        hideOverlay();
        toast('error', 'The save could not be completed. Reload the date to confirm whether it was recorded.');
        setBanner('error', 'The save could not be completed. Reload the date before retrying.');
        console.error(err);
        recalc();
      })
      .saveDailyAllocation(buildPayload());
  }

  /* --------------------- administrator revision ------------------- */

  function requestRevision() {
    if (!STATE.canRevise) {
      toast('warn', 'Only an authorized administrator can revise a saved date.');
      return;
    }
    // Unlock the fields for editing before the revision is submitted.
    STATE.readOnly = false;
    STATE.canEditRequired = true;
    STATE.canEditAcquired = true;
    STATE.canEditAlloted = true;
    renderAllocationRows(STATE.model.allocations);
    renderFlowRows(STATE.model.metalFlow);
    setHeaderStatus('warn', 'Revision mode');
    setBanner('warn', 'Revision mode. Edit the values, then use Submit Revision. All changes are audited.');
    $('btnSave').textContent = 'Submit Revision';
    $('btnSave').dataset.mode = 'revise';
    $('btnAdminRevise').classList.add('hidden');
    recalc();
    $('btnSave').disabled = false;
    updateSaveState(recalc());
  }

  function requestRevisionSubmit() {
    var t = recalc();
    openModal({
      title: 'Submit Revision',
      confirmLabel: 'Submit Revision',
      requireReason: true,
      bodyHtml:
        'Revise the saved allocation for <strong>' + esc(STATE.model.selectedDateDisplay) + '</strong>.<br><br>' +
        'The existing records in Metal Master and Metal Flow Master will be replaced. ' +
        'A before-and-after snapshot is written to the audit log.<br><br>' +
        'Actual Total Alloted: <strong>' + fmt3(t.totalAlloted) + ' kg</strong> &middot; ' +
        'Total Acquired: <strong>' + fmt3(t.totalAcquired) + ' kg</strong>',
      onConfirm: function () {
        var reason = String($('modalReason').value || '').trim();
        if (reason.length < 10) {
          $('modalReasonError').textContent = 'The revision reason must be at least 10 characters.';
          $('modalReasonError').classList.remove('hidden');
          return;
        }
        closeModal();
        doRevise(reason);
      }
    });
  }

  function doRevise(reason) {
    STATE.busy = true;
    $('btnSave').disabled = true;
    showOverlay('Submitting the administrator revision\u2026');

    google.script.run
      .withSuccessHandler(function (res) {
        STATE.busy = false;
        hideOverlay();
        if (res && res.ok) {
          toast('success', res.message);
          setBanner('success', res.message);
        } else {
          var msg = (res && res.message) || 'The revision could not be completed.';
          toast('error', msg);
          setBanner('error', msg);
        }
        $('btnSave').textContent = 'Save Current Data';
        delete $('btnSave').dataset.mode;
        loadDate(STATE.dateKey);
      })
      .withFailureHandler(function (err) {
        STATE.busy = false;
        hideOverlay();
        toast('error', 'The revision could not be completed. Reload the date to check the current state.');
        console.error(err);
        loadDate(STATE.dateKey);
      })
      .reviseDailyAllocation(buildPayload({ revisionReason: reason }));
  }

  /* ------------------------------ reset --------------------------- */

  function resetUnsaved() {
    if (!STATE.baseline || STATE.busy) return;
    openModal({
      title: 'Reset Unsaved Changes',
      confirmLabel: 'Reset',
      bodyHtml: 'Discard all values entered on this screen and restore the loaded starting values? Saved data is not affected.',
      onConfirm: function () {
        closeModal();
        STATE.model.allocations = JSON.parse(JSON.stringify(STATE.baseline.allocations));
        STATE.model.metalFlow = JSON.parse(JSON.stringify(STATE.baseline.metalFlow));
        renderAllocationRows(STATE.model.allocations);
        renderFlowRows(STATE.model.metalFlow);
        recalc();
        toast('info', 'Unsaved changes were reset.');
      }
    });
  }

  /* ----------------------------- events --------------------------- */

  function bindEvents() {
    $('allocationDate').addEventListener('change', function () {
      $('btnSave').textContent = 'Save Current Data';
      delete $('btnSave').dataset.mode;
      loadDate(this.value);
    });

    $('btnReloadDate').addEventListener('click', function () {
      $('btnSave').textContent = 'Save Current Data';
      delete $('btnSave').dataset.mode;
      loadDate($('allocationDate').value);
    });

    $('btnSave').addEventListener('click', function () {
      if (this.dataset.mode === 'revise') requestRevisionSubmit();
      else if (STATE.isOperator) requestSubmission();
      else requestSave();
    });

    $('btnReset').addEventListener('click', resetUnsaved);
    $('btnAdminRevise').addEventListener('click', requestRevision);

    $('modalCancel').addEventListener('click', closeModal);
    $('modalConfirm').addEventListener('click', function () {
      if (STATE.modalHandler) STATE.modalHandler();
    });
    $('modal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !$('modal').classList.contains('hidden')) closeModal();
    });

    // Live recalculation (event delegation covers re-rendered rows).
    document.addEventListener('input', function (e) {
      if (e.target && e.target.classList && e.target.classList.contains('cell-input')) recalc();
    });
    document.addEventListener('change', function (e) {
      if (e.target && e.target.classList && e.target.classList.contains('cell-input')) {
        var v = num(e.target.value);
        if (v < 0) v = 0;
        e.target.value = e.target.value === '' ? '' : fmt3(v);
        recalc();
      }
    });

    // Mobile card expand / collapse
    document.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.row-toggle') : null;
      if (!btn) return;
      var row = btn.closest('tr');
      if (!row) return;
      row.classList.toggle('is-collapsed');
      btn.innerHTML = row.classList.contains('is-collapsed') ? '&plus;' : '&minus;';
    });

    $('btnToggleCards').addEventListener('click', function () {
      var rows = document.querySelectorAll('#allocBody tr.alloc-row');
      var collapseAll = this.textContent.indexOf('Collapse') === 0;
      for (var i = 0; i < rows.length; i++) {
        rows[i].classList.toggle('is-collapsed', collapseAll);
        var tgl = rows[i].querySelector('.row-toggle');
        if (tgl) tgl.innerHTML = collapseAll ? '&plus;' : '&minus;';
      }
      this.textContent = collapseAll ? 'Expand all' : 'Collapse all';
    });

    window.addEventListener('beforeunload', function (e) {
      if (STATE.readOnly || !STATE.model) return;
      var t = computeTotals(readScreen());
      if (t.totalAlloted > 0 || t.totalAcquired > 0 || t.totalTodayRequired > 0) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    bindEvents();
    bootstrap();
  });
})();
</script>
